name: Tests

on:
  push:
    branches: [nightingale]
  pull_request:
    branches: [nightingale]

# Cancel superseded runs on the same ref to save runner minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.13"]

    env:
      QT_QPA_PLATFORM: offscreen
      SDL_VIDEODRIVER: dummy

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # PyQt6 wheels need EGL/GL system libraries on headless Linux runners.
      - name: Install Qt system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1

      # conftest.py puts the repo root on sys.path, so tests exercise the
      # source tree; opensesame-core provides the third-party dependencies.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install opensesame-core pytest pygame imageio imageio-ffmpeg

      - name: Run tests
        run: python -m pytest tests/ -q
